name: Camada 1 — pgTAP

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

env:
  PGSSLMODE: require

jobs:
  pgtap:
    name: Suite pgTAP (schema, triggers, RLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Forçar IPv4 (runners não suportam IPv6)
        run: |
          IPV4=$(getent ahosts db.usqzsprhqxpupizhpenz.supabase.co \
                 | awk '$2=="STREAM" && $1~/\./{print $1; exit}')
          echo "Resolved IPv4: $IPV4"
          echo "PGHOSTADDR=$IPV4" >> $GITHUB_ENV

      - name: Verificar conectividade
        run: psql "$SUPABASE_DB_URL" -c "SELECT version();"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Aplicar migrações (idempotente — seguro re-executar)
        run: |
          for f in supabase/migrations/000[1-9]_*.sql; do
            echo "▶ aplicar $(basename $f)"
            psql "$SUPABASE_DB_URL" --no-psqlrc -f "$f"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Ativar extensão pgTAP
        run: psql "$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Instalar funções auxiliares de teste
        run: psql "$SUPABASE_DB_URL" --no-psqlrc -f supabase/tests/00_helpers.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Executar suite pgTAP (01–08)
        run: |
          FALHOU=0
          for f in $(ls supabase/tests/0[1-9]_*.sql | sort); do
            echo ""
            echo "══════════════════════════════════════════"
            echo "▶  $(basename $f)"
            echo "══════════════════════════════════════════"
            psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=off \
              -f "$f" \
            || FALHOU=1
          done
          exit $FALHOU
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
