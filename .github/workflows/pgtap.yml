name: Camada 1 — pgTAP

# App em produção desde 2026-07-31 — este workflow reaplica as
# migrations e corre testes destrutivos diretamente contra
# SUPABASE_DB_URL, que aponta para o projeto live (não é idempotente
# em relação a renomeações de tabela, ex: migration 0006). Disparo
# automático em push DESATIVADO por segurança; corre manualmente via
# workflow_dispatch, idealmente contra um projeto Supabase de staging.
on:
  workflow_dispatch:

env:
  PGSSLMODE: require

jobs:
  pgtap:
    name: Suite pgTAP (schema, triggers, RLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Verificar conectividade
        run: psql "$SUPABASE_DB_URL" -c "SELECT version();"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Aplicar migrações (idempotente — seguro re-executar)
        run: |
          for f in supabase/migrations/000[1-9]_*.sql; do
            echo "▶ aplicar $(basename $f)"
            psql "$SUPABASE_DB_URL" --no-psqlrc -f "$f"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Ativar extensão pgTAP
        run: psql "$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Instalar funções auxiliares de teste
        run: psql "$SUPABASE_DB_URL" --no-psqlrc -f supabase/tests/00_helpers.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Executar suite pgTAP (01–08)
        run: |
          FALHOU=0
          for f in $(ls supabase/tests/0[1-9]_*.sql | sort); do
            echo ""
            echo "══════════════════════════════════════════"
            echo "▶  $(basename $f)"
            echo "══════════════════════════════════════════"
            psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=off \
              -f "$f" \
            || FALHOU=1
          done
          exit $FALHOU
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
